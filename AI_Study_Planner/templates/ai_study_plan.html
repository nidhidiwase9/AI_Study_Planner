<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your AI Study Plan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            font-family:'Poppins',sans-serif;
            background:linear-gradient(135deg,#4F46E5,#7C3AED,#06B6D4);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px 20px;
        }

        .result-card{
            width:100%;
            max-width:1100px;
            background:rgba(255,255,255,.15);
            backdrop-filter:blur(18px);
            border-radius:20px;
            padding:35px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        .title{
            color:white;
            text-align:center;
            margin-bottom:30px;
        }

        .title h2{
            font-weight:700;
            margin-top:10px;
        }

        .title p{
            opacity:.9;
            margin-bottom:0;
        }

        /* White document area */

        .response-box{
            background:#ffffff;
            color:#212529;
            border-radius:15px;
            padding:35px;
            box-shadow:0 8px 20px rgba(0,0,0,.15);
            line-height:1.9;
            overflow-x:auto;
        }

        .response-box h1,
        .response-box h2,
        .response-box h3,
        .response-box h4,
        .response-box h5,
        .response-box h6{
            color:#343a40;
            margin-top:30px;
            margin-bottom:15px;
            font-weight:600;
        }

        .response-box p{
            margin-bottom:16px;
        }

        .response-box ul,
        .response-box ol{
            margin-bottom:18px;
            padding-left:25px;
        }

        .response-box li{
            margin-bottom:8px;
        }

        .response-box strong{
            color:#4F46E5;
        }

        .response-box blockquote{
            border-left:5px solid #4F46E5;
            background:#f8f9fa;
            padding:15px 20px;
            font-style:italic;
            margin:20px 0;
        }

        .response-box code{
            background:#f1f3f5;
            color:#d63384;
            padding:2px 6px;
            border-radius:5px;
        }

        .response-box pre{
            background:#212529;
            color:#ffffff;
            padding:18px;
            border-radius:10px;
            overflow-x:auto;
        }

        .response-box table{
            width:100%;
            border-collapse:collapse;
            margin:25px 0;
        }

        .response-box th{
            background:#4F46E5;
            color:white;
        }

        .response-box th,
        .response-box td{
            border:1px solid #dee2e6;
            padding:12px;
        }

        .response-box tr:nth-child(even){
            background:#f8f9fa;
        }

        .btn-home{
            background:white;
            color:#4F46E5;
            border:none;
            border-radius:12px;
            padding:12px 25px;
            font-weight:600;
            transition:.3s;
        }

        .btn-home:hover{
            background:#0dcaf0;
            color:white;
            transform:translateY(-2px);
        }

    </style>

</head>

<body>

<div class="result-card">

    <div class="title">
        <i class="bi bi-stars display-4 text-white"></i>
        <h2>Your Personalized AI Study Plan</h2>
        <p class="text-white">
            Generated successfully using AI
        </p>
    </div>

    <div class="response-box">
        {{ resp|safe }}
    </div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-home">
            <i class="bi bi-arrow-left"></i>
            Generate Another Plan
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
